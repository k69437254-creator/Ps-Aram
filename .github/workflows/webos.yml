name: PS Link webOS IPK

on:
  push:
    branches:
      - feature/platform-completion-pack
    paths:
      - "receivers/webos/**"
      - "scripts/validate_webos_app.py"
      - ".github/workflows/webos.yml"
  pull_request:
    paths:
      - "receivers/webos/**"
      - "scripts/validate_webos_app.py"
      - ".github/workflows/webos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-webos:
    name: Validate and package LG webOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install official webOS CLI
        run: |
          npm install --global @webos-tools/cli@3.2.6
          ares -V
          ares-package -V

      - name: Validate application metadata and resources
        run: python3 scripts/validate_webos_app.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find receivers/webos -type f -name '*.js' -print0)

      - name: Run webOS receiver tests
        run: |
          node receivers/webos/tests/receiver.test.js
          node receivers/webos/tests/back-button.test.js

      - name: Prepare clean production application
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="receivers/webos"
          STAGE="$RUNNER_TEMP/webos-production"
          OUT="$RUNNER_TEMP/webos-ipk"

          rm -rf "$STAGE" "$OUT"
          mkdir -p "$STAGE/shared" "$OUT"

          FILES=(
            appinfo.json
            index.html
            icon.png
            largeicon.png
            app.css
            app.js
            media-player.js
            pslink-client.js
            shared/pslink-spatial-captions.js
            shared/tv-remote.js
          )

          for file in "${FILES[@]}"; do
            test -s "$SOURCE/$file"
            install -D "$SOURCE/$file" "$STAGE/$file"
          done

          echo "Production staging contents:"
          find "$STAGE" -type f -printf '%P\n' | sort

          test "$(find "$STAGE" -type f | wc -l)" -eq "${#FILES[@]}"

          if find "$STAGE" \( \
            -path '*/tests/*' -o \
            -name '*diagnostic*' -o \
            -name 'README.md' \
          \) -print -quit | grep -q .; then
            echo "Development files found in production staging." >&2
            exit 1
          fi

          echo "WEBOS_PRODUCTION_STAGING=PASSED"

      - name: Package production IPK
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/webos-production"
          OUT="$RUNNER_TEMP/webos-ipk"

          ares-package --outdir "$OUT" "$STAGE"

          mapfile -t PACKAGES < <(
            find "$OUT" -maxdepth 1 -type f -name '*.ipk' -print
          )

          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one IPK; found ${#PACKAGES[@]}" >&2
            exit 1
          fi

          IPK="${PACKAGES[0]}"
          test -s "$IPK"

          ares-package -i "$IPK"

          ar t "$IPK" | grep -Fx "data.tar.gz"

          ar p "$IPK" data.tar.gz |
            tar -tzf - > "$OUT/package-contents.txt"

          CONTENTS="$OUT/package-contents.txt"

          REQUIRED=(
            appinfo.json
            index.html
            icon.png
            largeicon.png
            app.css
            app.js
            media-player.js
            pslink-client.js
            shared/pslink-spatial-captions.js
            shared/tv-remote.js
          )

          for file in "${REQUIRED[@]}"; do
            grep -Eq "(^|/)${file//./\\.}$" "$CONTENTS" || {
              echo "Missing production resource: $file" >&2
              exit 1
            }
          done

          if grep -Eiq \
            '(^|/)(tests|README\.md)(/|$)|diagnostic' "$CONTENTS"; then
            echo "Development-only files leaked into production IPK." >&2
            exit 1
          fi

          echo "===== VERIFIED IPK CONTENTS ====="
          cat "$CONTENTS"
          echo "WEBOS_IPK_VALIDATION=PASSED"
          echo "WEBOS_IPK_PATH=$IPK"

      - name: Upload installable webOS IPK
        uses: actions/upload-artifact@v4
        with:
          name: PS-Link-webOS-IPK
          path: ${{ runner.temp }}/webos-ipk/*.ipk
          if-no-files-found: error
          retention-days: 14
