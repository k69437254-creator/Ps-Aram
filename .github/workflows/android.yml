name: PS Link Android builds

on:
  push:
    branches: [ main, master, 'feature/psn-oauth-integration', 'feature/multiplatform-tv-foundation', 'feature/phone-hls-receiver-v2', 'feature/platform-completion-pack', 'repair/comprehensive-media-platform' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PS Link
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Install native protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler ffmpeg tesseract-ocr
          protoc --version
          ffmpeg -version | head -n 1
          tesseract --version

      - name: Run Arabic OCR sample accuracy tests
        run: python3 tests/test_arabic_ocr.py

      - name: Prepare stable debug signing key when configured
        env:
          PSLINK_DEBUG_KEYSTORE_BASE64: ${{ secrets.PSLINK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$PSLINK_DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$PSLINK_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable debug signing key installed."
          else
            echo "WARNING: PSLINK_DEBUG_KEYSTORE_BASE64 is not configured; this APK will use this runner's temporary debug key and may not upgrade an APK signed by another runner."
          fi

      - name: Fetch pinned Chiaki-NG source and prepare project
        run: bash scripts/bootstrap.sh

      - name: Static source and PS5 integration checks
        run: bash scripts/check-source.sh

      - name: Run shared core tests
        run: bash ./gradlew --no-daemon --stacktrace :core:shared:testDebugUnitTest

      - name: Generate real AAC-LC ADTS fixture for HLS integration
        run: |
          set -Eeuo pipefail
          mkdir -p mobile/build/aac-fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" \
            -ac 2 -c:a aac -profile:a aac_low -b:a 128k \
            -f adts mobile/build/aac-fixtures/test-tone.aac
          test -s mobile/build/aac-fixtures/test-tone.aac
          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 mobile/build/aac-fixtures/test-tone.aac

      - name: Run PS Link final source audit
        run: bash scripts/10-final-repair-gate.sh

      - name: Run PS Link controller regression tests
        run: bash ./gradlew --no-daemon --stacktrace :mobile:testDebugUnitTest

      - name: Verify HLS MPEG-TS video and real AAC integration
        run: bash scripts/verify-hls-ts.sh

      - name: Build PS Link Mobile APK
        id: build_mobile
        run: bash ./gradlew --no-daemon --stacktrace :mobile:assembleDebug

      # Build TV independently after a mobile attempt so a phone failure does not
      # hide the separate companion-app result. The job still fails if mobile fails.
      - name: Build PS Link TV APK
        id: build_tv
        if: ${{ always() && steps.build_mobile.outcome != 'skipped' }}
        run: bash ./gradlew --no-daemon --stacktrace :tv:app:assembleDebug

      - name: Build PS Link Google TV APK
        id: build_google_tv
        if: ${{ always() && steps.build_mobile.outcome != 'skipped' }}
        run: bash ./gradlew --no-daemon --stacktrace :tv-google:app:assembleDebug

      - name: Build PS Link Fire TV APK
        id: build_fire_tv
        if: ${{ always() && steps.build_mobile.outcome != 'skipped' }}
        run: bash ./gradlew --no-daemon --stacktrace :tv-fire:app:assembleDebug

      - name: Verify PS Link Mobile APK package ID
        if: ${{ always() && steps.build_mobile.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find mobile/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo "Mobile APK was not found" >&2; exit 1; }
          bash scripts/verify-apk.sh "$APK" com.pslink.app

      - name: Verify PS Link TV APK package ID
        if: ${{ always() && steps.build_tv.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find tv/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo "TV APK was not found" >&2; exit 1; }
          bash scripts/verify-apk.sh "$APK" com.pslink.tv

      - name: Verify PS Link Google TV APK package ID
        if: ${{ always() && steps.build_google_tv.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find tv-google/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo "Google TV APK was not found" >&2; exit 1; }
          bash scripts/verify-apk.sh "$APK" com.pslink.tvgoogle

      - name: Verify PS Link Fire TV APK package ID
        if: ${{ always() && steps.build_fire_tv.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find tv-fire/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo "Fire TV APK was not found" >&2; exit 1; }
          bash scripts/verify-apk.sh "$APK" com.pslink.tvfire

      - name: Upload PS Link Mobile APK
        if: ${{ always() && steps.build_mobile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: PS-Link-Mobile-APK
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload PS Link TV APK
        if: ${{ always() && steps.build_tv.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: PS-Link-TV-APK
          path: tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload PS Link Google TV APK
        if: ${{ always() && steps.build_google_tv.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: PS-Link-Google-TV-APK
          path: tv-google/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload PS Link Fire TV APK
        if: ${{ always() && steps.build_fire_tv.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: PS-Link-Fire-TV-APK
          path: tv-fire/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Keep test reports and generated transport streams available even
      # when a later verification or packaging step fails.
      - name: Upload PS Link test reports and HLS evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PS-Link-Test-Reports-and-HLS-Evidence
          path: |
            mobile/build/test-results/testDebugUnitTest/**
            mobile/build/reports/tests/testDebugUnitTest/**
            mobile/build/hls-integration-test/**
            mobile/build/hls-aac-integration-test/**
            mobile/build/repair-audit/**
          if-no-files-found: warn
          retention-days: 14
